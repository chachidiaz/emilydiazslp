<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Finder for SLPs</title>
<meta name="description" content="Answer five quick questions, get a digital product idea that fits you, then test it against the market before you build.">
<style>
/* Brand fonts. Upload the font files into a "fonts" folder next to this page
   (or change these paths). Without them the page falls back to system fonts. */
@font-face{font-family:"Bringbold Nineties";src:url("fonts/BringboldNineties-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"MADE Tommy Soft";src:url("fonts/MadeTommySoft-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"MADE Tommy Soft";src:url("fonts/MadeTommySoft-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"MADE Tommy Soft";src:url("fonts/MadeTommySoft-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}

:root{
  --orange:#ff4d03; --orange-text:#c93a00; --pink:#f3b9b6; --lime:#d0ce5d; --sky:#d0e8f5;
  --berry:#942949; --ink:#24101a; --ink-muted:#6b4f58; --cream:#fdf8f2; --white:#ffffff; --line:#ead9cf;
  --font-display:"Bringbold Nineties", Georgia, serif;
  --font-sans:"MADE Tommy Soft", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-sans);letter-spacing:-0.01em;font-synthesis:none;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;letter-spacing:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
input::placeholder,textarea::placeholder{color:var(--ink-muted)}
.display{font-family:var(--font-display);font-weight:400}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.wrap{max-width:1200px;margin:0 auto;padding-left:16px;padding-right:16px}
.site-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;padding-bottom:20px}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:block;width:170px;height:auto}
.brand-rule{width:2px;height:40px;background:var(--line);border-radius:2px}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name{font-size:26px;line-height:1;letter-spacing:-0.3px}
.brand-sub{font-size:14px;font-weight:500;color:var(--ink-muted)}
.ghost{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--ink);background:transparent;font-size:15px;font-weight:500;cursor:pointer}

.layout{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;padding-top:8px;padding-bottom:48px}
.column{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:28px}
.screen{display:flex;flex-direction:column;gap:28px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;border-radius:999px;font-size:16px;font-weight:500;cursor:pointer;text-decoration:none;transition:transform .15s ease,opacity .15s ease}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--orange);color:var(--ink);border:none;padding:6px 6px 6px 24px}
.btn-light{background:var(--white);color:var(--ink);border:2px solid var(--ink);padding:6px 6px 6px 24px}
.btn-light.back{padding:6px 22px 6px 6px}
.btn-soft{background:var(--white);color:var(--ink);border:none;padding:6px 6px 6px 20px;min-height:48px;font-size:15px}
.btn-lg{min-height:56px;font-size:17px;padding-left:28px}
.disc{flex:none;width:38px;height:38px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.disc-ink{background:var(--ink);color:var(--cream)}
.disc-sky{background:var(--sky);color:var(--ink)}
.textbtn{min-height:52px;padding:0 12px;border:none;background:none;font-size:16px;font-weight:500;text-decoration:underline;cursor:pointer}
.linkbtn{min-height:44px;padding:0 4px;border:none;background:none;color:var(--orange-text);font-size:15px;font-weight:500;text-decoration:underline;cursor:pointer}

/* Intro */
.intro{flex:1 1 100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px;padding:40px 0 24px}
.sticker{width:112px;height:112px;border-radius:999px;background:var(--lime);display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg);font-size:16px;font-weight:700;line-height:1.15;padding:12px}
.eyebrow{margin:0;font-size:18px;font-weight:500;color:var(--orange-text)}
.hero-title{margin:0;max-width:980px;font-size:clamp(48px,9vw,108px);line-height:.98;letter-spacing:-0.8px}
.accent{color:var(--orange)}
.lead{margin:0;max-width:680px;font-size:clamp(18px,2.4vw,22px);line-height:1.55}
.parts{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:24px;text-align:left}
.part{background:var(--white);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:16px}
.part.sky{background:var(--sky)}
.part-title{font-family:var(--font-display);font-size:32px;line-height:1.05}
.numlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.numlist li{display:flex;align-items:baseline;gap:12px;font-size:17px;font-weight:500}
.numlist .n{font-family:var(--font-display);font-size:26px;min-width:34px;color:var(--orange)}
.part.sky .numlist .n{color:var(--ink)}
.numeral{font-family:var(--font-display);font-weight:400;line-height:1;color:var(--orange)}

/* Progress rail */
.side{flex:1 1 260px;max-width:100%;position:sticky;top:16px}
.side-card{background:var(--white);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.side-head{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:500;color:var(--ink-muted)}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:var(--orange);transition:width .3s ease}
.stepnav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stepnav li{display:flex}
.nav-group{padding:14px 10px 4px;font-size:13px;font-weight:700;color:var(--ink-muted);letter-spacing:0}
.stepnav li.nav-group:first-child{padding-top:0}
.navitem{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 10px;border:none;border-radius:14px;background:transparent;cursor:pointer;text-align:left}
.navitem:hover:not(:disabled){background:var(--cream)}
.navitem:disabled{opacity:.55;cursor:not-allowed}
.navitem.current{background:var(--sky)}
.navdisc{flex:none;width:34px;height:34px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:transparent;color:var(--ink-muted);border:2px solid var(--line)}
.navitem.ready .navdisc{background:var(--lime);color:var(--ink);border:none}
.navitem.done .navdisc{background:var(--orange);color:var(--ink);border:none}
.navitem.current .navdisc{background:var(--ink);color:var(--cream);border:none}
.navtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.navlabel{font-size:16px;font-weight:500;line-height:1.25}
.navanswer{font-size:14px;line-height:1.35;font-weight:500;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.navitem.done .navanswer{color:var(--ink)}

/* Questions & cards */
.q-head{display:flex;flex-direction:column;gap:12px}
.q-title{margin:0;font-size:clamp(32px,5vw,48px);font-weight:500;line-height:1.12;letter-spacing:-0.025em}
.q-title:focus,.r-title:focus{outline:none}
.q-help{margin:0;max-width:640px;font-size:18px;line-height:1.6;color:var(--ink-muted)}
.sub-title{margin:0;font-size:26px;font-weight:500;line-height:1.25;letter-spacing:-0.02em}
.options{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.opt{text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;padding:20px 20px 22px;border-radius:20px;border:2px solid var(--line);background:var(--white);cursor:pointer;transition:border-color .15s ease,background-color .15s ease,transform .15s ease}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.99)}
.opt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.opt-title{font-size:19px;font-weight:500;line-height:1.3;letter-spacing:-0.015em}
.opt-dot{flex:none;width:26px;height:26px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.opt[role="checkbox"] .opt-dot{border-radius:8px}
.opt-desc{font-size:15px;line-height:1.45;color:var(--ink-muted)}
.opt[aria-checked="true"]{background:var(--pink);border-color:var(--ink)}
.opt[aria-checked="true"] .opt-dot{background:var(--ink);color:var(--cream);border:none}
.opt[aria-checked="true"] .opt-desc{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;font-weight:500}
.field input,.field textarea,.other input{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--ink);background:var(--white);font-size:16px}
.field textarea{padding:12px 14px;line-height:1.5;resize:vertical;min-height:96px}
.other{display:flex;flex-direction:column;gap:8px;max-width:520px}
.other label{font-size:17px;font-weight:500}
.other input{min-height:52px;font-size:17px}
.hint{font-size:14px;font-weight:500;color:var(--ink-muted)}
.stepbar{position:sticky;bottom:0;z-index:2;background:var(--cream);border-top:1px solid var(--line);padding:14px 0 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}

/* Market check */
.phrases{background:var(--white);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px}
.phrases .hint{font-size:14px}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.place{background:var(--white);border:2px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.place-name{font-size:19px;font-weight:500}
.place-what{font-size:15px;line-height:1.45;color:var(--ink-muted);flex-grow:1}
.place a{min-height:44px;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--orange-text)}
.place a:hover{color:var(--ink)}
.comp-row{margin:0;border:none;background:var(--white);border-radius:20px;padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.comp-row legend{float:left;width:100%;padding:0;margin-bottom:4px;font-family:var(--font-display);font-size:26px;color:var(--orange)}
.note{background:var(--sky);border-radius:20px;padding:20px 24px;font-size:17px;line-height:1.55}
.summary{background:var(--lime);border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:4px}
.summary .k{font-size:14px;font-weight:500}
.summary .big{font-size:20px;font-weight:500;letter-spacing:-0.02em}
.meter{max-width:420px;display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:500}
.meter .track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.meter .fill{height:100%;border-radius:999px}
.fineprint{margin:0;font-size:14px;font-weight:500;color:var(--ink-muted)}

/* Result */
.r-title{margin:0;font-size:clamp(42px,6.5vw,76px);line-height:1;letter-spacing:-0.6px}
.v-title{font-size:clamp(40px,6vw,68px);line-height:1.02}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500;background:var(--white)}
.pill.lime{background:var(--lime)} .pill.sky{background:var(--sky)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--white);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px}
.card.sky{background:var(--sky)}
.card.pink{background:var(--pink);padding:28px;gap:12px;align-items:flex-start}
.card h3,.card h4{margin:0;font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.08}
.card h4{font-size:30px}
.card p{margin:0;font-size:17px;line-height:1.55}
.dots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.dots li{display:flex;gap:12px;font-size:17px;line-height:1.5}
.dots li::before{content:"";flex:none;width:10px;height:10px;margin-top:8px;border-radius:999px;background:var(--orange)}
.card.sky .dots li::before{background:var(--ink)}
.steps-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.steps-list li{display:flex;gap:14px;font-size:17px;line-height:1.5}
.steps-list .n{font-family:var(--font-display);font-size:26px;line-height:1.05;min-width:34px}
.moves{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.moves li{display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.55}
.moves .numeral{font-size:48px}
.panel{background:var(--berry);color:var(--cream);border-radius:32px;padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.panel .k{margin:0;font-size:18px;font-weight:500;color:var(--pink)}
.panel h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(34px,4.5vw,52px);line-height:1.02}
.panel p{margin:0;max-width:640px;font-size:18px;line-height:1.6}
.panel .numlist li{font-size:18px}
.panel .numlist .n{color:var(--pink)}
.section-title{margin:0;font-size:28px;font-weight:500;line-height:1.25;letter-spacing:-0.02em}
.alt-meta{font-size:14px;font-weight:500}
.alt-note{margin:0;font-size:15px;font-weight:500;color:var(--ink-muted)}

/* Footer */
.site-footer{background:var(--berry);color:var(--cream);margin-top:32px}
.footer-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px;padding-top:28px;padding-bottom:28px}
.footer-inner p{margin:0;font-size:15px;font-weight:500}
.footer-inner nav{display:flex;flex-wrap:wrap;gap:4px 24px}
.footer-inner a{min-height:44px;display:inline-flex;align-items:center;color:var(--pink);font-size:15px;font-weight:500}
.footer-inner a:hover{color:var(--cream)}
.footer-inner a:focus-visible{outline:3px solid var(--cream);outline-offset:3px}

@media (max-width: 760px){
  .side{position:static;flex:1 1 100%}
  .side-card{padding:14px}
  .side-head,.bar{display:none}
  .stepnav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px;align-items:center}
  .navitem{width:auto;flex:0 0 auto;padding:4px}
  .navtext{display:none}
  .nav-group{font-size:0;padding:0 !important;margin:0 4px;width:2px;height:28px;background:var(--line);flex:none}
  .stepnav li.nav-group:first-child{display:none}
  .card{padding:24px}
  .layout{gap:20px}
  .brand-rule{display:none}
  .brand{gap:10px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>

<footer class="site-footer">

<script>
(function () {
  'use strict';

  // =====================================================================
  // CONTENT — edit freely. No AI, no network calls: every result below is
  // built from these lists and the rules in the LOGIC section.
  // =====================================================================

  // ---------- Part 1: the five questions ----------
  var STEPS = [
    { key: 'audience', label: 'Who you serve', question: 'Who do you most want to help?', help: 'Pick the people you would happily talk to all day. Your product is for them.', options: [
      { id: 'parents', title: 'Parents & caregivers', desc: 'Families who want to help at home between sessions', obj: 'parents and caregivers', search: 'parents' },
      { id: 'school', title: 'School SLPs', desc: 'Clinicians juggling big caseloads and IEP season', obj: 'school SLPs', search: 'school SLPs' },
      { id: 'newslp', title: 'New SLPs & CFs', desc: 'Clinicians in their first few years who want a guide', obj: 'new SLPs and CFs', search: 'new SLPs' },
      { id: 'teachers', title: 'Teachers & classroom staff', desc: 'Educators who want to support communication in class', obj: 'teachers and classroom staff', search: 'teachers' },
      { id: 'medical', title: 'Adult & medical SLPs', desc: 'Clinicians in hospitals, rehab and home health', obj: 'adult and medical SLPs', search: 'medical SLPs' },
      { id: 'owners', title: 'Private practice owners', desc: 'SLPs running or starting their own practice', obj: 'private practice owners', search: 'private practice SLPs' }
    ] },
    { key: 'expertise', label: 'What you know', question: 'What could you teach in your sleep?', help: 'Go with the area people already ask you about. That is usually your best product.', options: [
      { id: 'early', title: 'Late talkers & early language', desc: 'Toddlers, play and first words', topic: 'Late Talker', search: 'late talker', outcome: 'get toddlers talking through everyday routines' },
      { id: 'speech', title: 'Speech sounds', desc: 'Articulation and phonology', topic: 'Speech Sound', search: 'articulation', outcome: 'practise speech sounds in a way that carries over' },
      { id: 'aac', title: 'AAC', desc: 'Devices, core words and modelling', topic: 'AAC', search: 'AAC', outcome: 'make AAC part of every day, not just sessions' },
      { id: 'fluency', title: 'Stuttering', desc: 'Fluency, confidence and acceptance', topic: 'Stuttering', search: 'stuttering', outcome: 'talk about stuttering with more confidence and less fear' },
      { id: 'feeding', title: 'Feeding & picky eating', desc: 'Mealtimes, textures and new foods', topic: 'Picky Eating', search: 'picky eating', outcome: 'make mealtimes calmer and grow the foods kids will try' },
      { id: 'social', title: 'Neuro-affirming communication', desc: 'Autism, connection and self-advocacy', topic: 'Neuro-Affirming', search: 'neurodiversity affirming speech therapy', outcome: 'support connection without forcing scripts or eye contact' },
      { id: 'literacy', title: 'Language & literacy', desc: 'Vocabulary, narratives and reading', topic: 'Literacy', search: 'language and literacy speech therapy', outcome: 'build the language that sits under reading and writing' },
      { id: 'adult', title: 'Adult neuro & swallowing', desc: 'Aphasia, cognition and dysphagia', topic: 'Adult Neuro', search: 'aphasia', outcome: 'support recovery after stroke, brain injury and swallowing changes' },
      { id: 'business', title: 'Paperwork & systems', desc: 'Documentation, scheduling and caseload', topic: 'Practice Systems', search: 'SLP documentation', outcome: 'cut paperwork time and run a smoother caseload' },
      { id: 'other', title: 'Other', desc: 'Something else? Type it in below' }
    ] },
    { key: 'time', label: 'Your time', question: 'How much time can you give this each week?', help: 'Be honest. A small product you finish beats a big one that sits half-built.', options: [
      { id: 't1', title: '1–2 hours', desc: 'Nap times and Sunday afternoons', level: 1 },
      { id: 't2', title: '3–5 hours', desc: 'A couple of evenings a week', level: 2 },
      { id: 't3', title: '6–10 hours', desc: 'A real side project', level: 3 },
      { id: 't4', title: '10+ hours', desc: 'This is becoming part of my job', level: 4 }
    ] },
    { key: 'comfort', label: 'How you create', question: 'How do you like to share what you know?', help: 'Choose what sounds fun, not what you think you should do. You will stick with the fun one.', options: [
      { id: 'print', title: 'Writing & designing', desc: 'Printables, guides, visuals and handouts' },
      { id: 'systems', title: 'Building templates', desc: 'Checklists, trackers and editable forms' },
      { id: 'camera', title: 'Teaching on camera', desc: 'Recorded lessons people watch in their own time' },
      { id: 'live', title: 'Teaching live', desc: 'Workshops, Q&As and small groups' }
    ] },
    { key: 'goal', label: 'Your goal', question: 'What do you want this product to do for you?', help: 'There is no wrong answer here. It just changes how you launch.', options: [
      { id: 'quick', title: 'A quick first win', desc: 'Something small I can launch soon and learn from' },
      { id: 'list', title: 'Grow my audience', desc: 'Get my work in front of more people and build an email list' },
      { id: 'income', title: 'Steady extra income', desc: 'A product that sells again and again' },
      { id: 'signature', title: 'My signature offer', desc: 'The big thing I want to be known for' }
    ] }
  ];

  var FORMATS = {

    html += navButton(9, 'Gap or no demand?', m3 && state.step !== 9 ? CHECK : '3', m3 ? 'done' : (all && m1 ? 'ready' : ''), all && m1, m3 ? sc + ' of 7 signals' : needM1);
    html += navButton(10, 'Market verdict', '✓', all && m1 ? 'ready' : '', all && m1, needM1);
    return '<nav class="side" aria-label="Steps"><div class="side-card">' +
      '<div class="side-head"><span>Your progress</span><span>' + count + ' of 9</span></div>' +
      '<div class="bar" aria-hidden="true"><span style="width:' + Math.round(count / 9 * 100) + '%"></span></div>' +
      '<ol class="stepnav">' + html + '</ol></div></nav>';
  }

  function optCard(o, sel, action, role) {
    return '<button type="button" class="opt" role="' + (role || 'radio') + '" aria-checked="' + sel + '" data-action="' + action + '" data-id="' + o.id + '">' +
      '<span class="opt-top"><span class="opt-title">' + esc(o.title) + '</span><span class="opt-dot">' + (sel ? CHECK : '') + '</span></span>' +
      '<span class="opt-desc">' + esc(o.desc) + '</span></button>';
  }

  function head(eyebrow, id, title, help) {
    return '<div class="q-head"><p class="eyebrow">' + eyebrow + '</p>' +
      '<h2 id="' + id + '" class="q-title" tabindex="-1">' + esc(title) + '</h2>' +
      (help ? '<p class="q-help">' + esc(help) + '</p>' : '') + '</div>';
  }

  function question() {
    var q = STEPS[state.step - 1], a = state.answers;
    var opts = q.options.map(function (o) { return optCard(o, a[q.key] === o.id, 'pick'); }).join('');
    var other = '';
    if (q.key === 'expertise' && a.expertise === 'other') {
      other = '<div class="other"><label for="other-input">What\'s your area?</label>' +
        '<input id="other-input" type="text" maxlength="40" autocomplete="off" placeholder="e.g. Voice, cluttering, accent modification" value="' + esc(a.otherText || '') + '">' +
        '<span class="hint">Keep it short. It becomes the name of your product.</span></div>';
    }
    return '<section class="screen" aria-labelledby="q-title">' +
      head('Step ' + state.step + ' of 5 · ' + esc(q.label), 'q-title', q.question, q.help) +
      '<div class="options" role="radiogroup" aria-labelledby="q-title">' + opts + '</div>' + other +
    '</section>';
  }

  function result() {
    var r = currentIdea();
    var copyLabel = state.copied === 'yes' ? 'Copied' : 'Copy My Idea';
    return '<section class="screen" aria-labelledby="r-title" style="gap:32px">' +
      '<div style="display:flex;flex-direction:column;gap:16px">' +
        (r.isAlt ? '<p class="alt-note">You\'re looking at a backup idea. <button type="button" class="linkbtn" data-action="top">Back to my top pick</button></p>' : '') +
        '<p class="eyebrow">' + (r.isAlt ? 'Backup idea' : 'Your product idea') + '</p>' +
        '<h2 id="r-title" class="display r-title" tabindex="-1">' + esc(r.title) + '</h2>' +
        '<p class="lead" style="max-width:720px">' + esc(r.pitch) + '</p>' +
        '<div class="pills"><span class="pill">' + esc(r.formatName) + '</span><span class="pill lime">' + esc(r.tier) + '</span><span class="pill sky">Build time: ' + esc(r.build) + '</span></div>' +
        '<div class="actions">' +
          '<button type="button" class="btn btn-primary" data-action="go" data-step="7">Test It Against the Market <span class="disc disc-ink">' + ARROW + '</span></button>' +
          '<button type="button" class="btn btn-light" data-action="copy"><span class="lbl">' + copyLabel + '</span> <span class="disc disc-sky">' + ARROW + '</span></button>' +
          '<button type="button" class="textbtn" data-action="go" data-step="1">Change my answers</button>' +
        '</div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="card"><h3>What\'s inside</h3><ul class="dots">' + r.inside.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="card sky"><h3>Why it fits you</h3><ul class="dots">' + r.why.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
      '</div>' +
      '<div class="panel"><p class="k">Before you build anything</p><h3>Test it against the market.</h3>' +
        '<p>A good idea isn\'t enough. In three short steps you\'ll find out:</p>' + numlist(MARKET_INTRO, 'long') +
        '<button type="button" class="btn btn-soft" style="margin-top:8px;min-height:52px;font-size:16px;padding-left:24px" data-action="go" data-step="7">Start the Market Check <span class="disc disc-sky">' + ARROW + '</span></button>' +
      '</div>' +
      '<div class="card" style="gap:20px"><h3>Your first three moves</h3><ol class="moves">' +
        r.moves.map(function (m, i) { return '<li><span class="numeral">0' + (i + 1) + '</span><span>' + esc(m) + '</span></li>'; }).join('') +
      '</ol></div>' +
      '<div style="display:flex;flex-direction:column;gap:16px"><h3 class="section-title">Two more ideas worth a look</h3><div class="grid2">' +
        r.alts.map(function (al) {
          return '<div class="card pink"><span class="alt-meta">' + esc(al.formatName) + ' · ' + esc(al.tier) + '</span>' +
            '<h4>' + esc(al.title) + '</h4><p>' + esc(al.pitch) + '</p>' +
            '<button type="button" class="btn btn-soft" data-action="alt" data-key="' + al.key + '">Show Me This One <span class="disc disc-sky" style="width:34px;height:34px">' + ARROW + '</span></button></div>';
        }).join('') +
      '</div></div>' +
    '</section>';
  }

  function market1() {
    var r = currentIdea(), R = state.research;
    var pl = places(r.phrases).map(function (p) {
      return '<div class="place"><span class="place-name">' + esc(p.name) + '</span><span class="place-what">' + esc(p.what) + '</span>' +
        '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.cta) + '<span class="sr-only"> (opens in a new tab)</span>' + OUT + '</a></div>';
    }).join('');
    return '<section class="screen" aria-labelledby="m1-title">' +
      head('Market check 1 of 3 · Who’s selling it', 'm1-title', 'Is anyone already paying for this?', 'Give this about 20 minutes. Search where SLPs, teachers and parents already shop. Each link opens a search for your idea in a new tab.') +
      '<div class="phrases"><span class="hint">Search phrases to try for “' + esc(r.title) + '”</span><div class="pills">' +
        r.phrases.map(function (p) { return '<span class="pill lime">' + esc(p) + '</span>'; }).join('') + '</div></div>' +
      '<div class="places">' + pl + '</div>' +
      '<h3 id="m1-q" class="sub-title">What did you find?</h3>' +
      '<div class="options" role="radiogroup" aria-labelledby="m1-q">' + COMP.map(function (o) { return optCard(o, R.comp === o.id, 'comp'); }).join('') + '</div>' +
    '</section>';
  }

  function market2() {
    var R = state.research;
    var rows = R.rows.map(function (row, i) {
      return '<fieldset class="comp-row"><legend>Product 0' + (i + 1) + '</legend>' +
        '<div class="field"><label for="c' + i + '-name">Product or seller</label><input id="c' + i + '-name" data-row="' + i + '" data-field="name" type="text" autocomplete="off" placeholder="e.g. AAC starter kit on TPT" value="' + esc(row.name) + '"></div>' +
        '<div class="field"><label for="c' + i + '-price">Price ($)</label><input id="c' + i + '-price" data-row="' + i + '" data-field="price" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 29" value="' + esc(row.price) + '"></div>' +
        '<div class="field"><label for="c' + i + '-reviews">Number of reviews</label><input id="c' + i + '-reviews" data-row="' + i + '" data-field="reviews" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 140" value="' + esc(row.reviews) + '"></div>' +
      '</fieldset>';
    }).join('');
    return '<section class="screen" aria-labelledby="m2-title">' +
      head('Market check 2 of 3 · What they charge', 'm2-title', 'What are people paying?', 'Log up to three of the closest products you found. Reviews count as proof people actually bought it, not just that it’s for sale.') +
      (R.comp === 'none' ? '<div class="note">You didn’t find anyone selling this exact idea. If you spotted close cousins (same topic in another format), log those. If not, skip ahead to the next step.</div>' : '') +
      '<div style="display:flex;flex-direction:column;gap:16px">' + rows + '</div>' +
      '<div class="field"><label for="gaps-input" style="font-size:17px">What do buyers wish was different?</label>' +
        '<span class="hint" style="font-weight:400;font-size:15px">Read the 1- to 3-star reviews and the questions people ask. Their complaints are your angle.</span>' +
        '<textarea id="gaps-input" rows="3" placeholder="e.g. Too generic, not for older kids, no editable version">' + esc(R.gaps) + '</textarea></div>' +
      '<div class="summary" aria-live="polite"><span class="k">What you\'ve found so far</span><span class="big" id="price-summary"></span><span id="review-summary"></span></div>' +
    '</section>';
  }

  function updateSummary() {
    var st = priceStats(state.research.rows);
    var p = document.getElementById('price-summary'), r = document.getElementById('review-summary');
    if (!p) return;
    p.textContent = st.prices.length ? 'Prices: ' + money(st.lo) + (st.hi !== st.lo ? ' to ' + money(st.hi) + ', middle ' + money(st.mid) : '') : 'No prices logged yet';
    r.textContent = st.reviews ? st.reviews.toLocaleString('en-US') + ' reviews across ' + st.reviewed + ' product' + (st.reviewed === 1 ? '' : 's') + '. People are buying.' : 'Add review counts to see whether people are actually buying.';
  }

  function market3() {
    var R = state.research;
    var intro = (R.comp === 'none' || R.comp === 'adjacent')
      ? 'Nobody selling it can mean a gap, or it can mean nobody wants it. These signs tell the two apart.'
      : 'Sellers prove people buy this. Now check that people want your version of it.';
    return '<section class="screen" aria-labelledby="m3-title">' +
      head('Market check 3 of 3 · Gap or no demand?', 'm3-title', 'Is there real demand behind it?', intro) +
      '<h3 id="m3-q" class="sub-title">Tick every sign you\'ve seen</h3>' +
      '<div class="options" role="group" aria-labelledby="m3-q">' + SIGNALS.map(function (o) { return optCard(o, !!R.signals[o.id], 'signal', 'checkbox'); }).join('') + '</div>' +
      '<div class="card sky"><h3>Talk to five real people</h3>' +
        '<p>The fastest way to tell a gap from a dead end. Ask five people in your audience these questions. Don\'t pitch your idea until the end. Listen for money they\'ve already spent and the exact words they use.</p>' +
        '<ol class="steps-list">' + SCRIPT.map(function (t, i) { return '<li><span class="n">0' + (i + 1) + '</span><span>' + esc(t) + '</span></li>'; }).join('') + '</ol>' +
      '</div>' +
    '</section>';
  }

  function verdict() {
    var r = currentIdea(), v = currentVerdict();
    var copyLabel = state.copied === 'yes' ? 'Copied' : 'Copy My Research';
    var weak = v.key === 'nodemand' || v.key === 'unsure';
    return '<section class="screen" aria-labelledby="v-title">' +
      '<div style="display:flex;flex-direction:column;gap:16px">' +
        '<p class="eyebrow">Market verdict for ' + esc(r.title) + '</p>' +
        '<h2 id="v-title" class="display r-title v-title" tabindex="-1">' + esc(v.title) + '</h2>' +
        '<p class="lead" style="max-width:720px">' + esc(v.body) + '</p>' +
        '<div class="meter"><span>Demand signals: ' + v.signals + ' of 7</span><div class="track" aria-hidden="true"><div class="fill" style="width:' + Math.round(v.signals / 7 * 100) + '%;background:' + (v.signals >= 3 ? 'var(--orange)' : 'var(--berry)') + '"></div></div></div>' +
        '<div class="actions">' +
          '<button type="button" class="btn btn-primary" data-action="copy"><span class="lbl">' + copyLabel + '</span> <span class="disc disc-ink">' + ARROW + '</span></button>' +
          '<button type="button" class="btn btn-light" data-action="go" data-step="6">' + (weak ? 'See My Backup Ideas' : 'Back to My Idea') + ' <span class="disc disc-sky">' + ARROW + '</span></button>' +
        '</div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="card"><h3>What you found</h3><ul class="dots">' + v.evidence.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="card sky"><h3>What to do next</h3><ol class="steps-list">' + v.moves.map(function (t, i) { return '<li><span class="n">0' + (i + 1) + '</span><span>' + esc(t) + '</span></li>'; }).join('') + '</ol></div>' +
      '</div>' +
      '<p class="fineprint">This verdict comes only from what you entered. It\'s a starting point for your decision, not a guarantee.</p>' +
    '</section>';
  }

  function stepBar() {
    var s = state.step, can;
    if (s >= 1 && s <= 5) can = isAnswered(state.answers, STEPS[s - 1].key);
    else if (s === 7) can = !!state.research.comp;
    else can = true;
    var label = s === 5 ? 'See My Idea' : (s === 9 ? 'See My Verdict' : 'Next');
    return '<div class="stepbar">' +
      '<button type="button" class="btn btn-light back" data-action="back"><span class="disc disc-sky">' + ARROW_L + '</span>Back</button>' +
      '<button type="button" class="btn btn-primary" id="next-btn" data-action="next"' + (can ? '' : ' disabled') + '>' + label + ' <span class="disc disc-ink">' + ARROW + '</span></button>' +
    '</div>';
  }

  function render(focusTarget) {
    var s = state.step, body;
    // Guard against jumping to a step that isn't unlocked yet.
    if (s >= 6 && !allDone()) s = state.step = firstOpen();
    if (s >= 8 && !state.research.comp) s = state.step = 7;
    if (s === 0) body = intro();
    else {
      var col = '';
      if (s <= 5) col = question();
      else if (s === 6) col = result();
      else if (s === 7) col = market1();
      else if (s === 8) col = market2();
      else if (s === 9) col = market3();
      else col = verdict();
      if ((s >= 1 && s <= 5) || (s >= 7 && s <= 9)) col += stepBar();
      body = sideNav() + '<div class="column">' + col + '</div>';
    }
    app.innerHTML = header() + '<main class="wrap layout">' + body + '</main>';
    if (s === 8) updateSummary();
    if (focusTarget) {
      var el = typeof focusTarget === 'string' ? document.getElementById(focusTarget) : app.querySelector(focusTarget.sel);
      if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
    }
  }

  var HEADINGS = { 6: 'r-title', 7: 'm1-title', 8: 'm2-title', 9: 'm3-title', 10: 'v-title' };
  function go(n) {
    state.step = n; state.copied = '';
    render(n >= 1 && n <= 5 ? 'q-title' : HEADINGS[n] || null);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function summaryText() {
    var r = currentIdea(), R = state.research;
    var t = r.title + '\n' + r.pitch + '\n\n' + r.formatName + ' · ' + r.tier + ' · Build time: ' + r.build +
      '\n\nWhat’s inside:\n- ' + r.inside.join('\n- ') +
      '\n\nWhy it fits me:\n- ' + r.why.join('\n- ');
    var v = state.step === 10 ? currentVerdict() : null;
    if (v) {
      t += '\n\nMARKET CHECK\nVerdict: ' + v.title + '\n- ' + v.evidence.join('\n- ');
      var logged = R.rows.filter(function (row) { return row.name || row.price || row.reviews; });
      if (logged.length) t += '\n\nProducts I found:\n' + logged.map(function (row) {
        return '- ' + (row.name || 'Unnamed') + (num(row.price) ? ' — ' + money(num(row.price)) : '') + (num(row.reviews) ? ' — ' + num(row.reviews) + ' reviews' : '');
      }).join('\n');
      t += '\n\nWhat to do next:\n' + v.moves.map(function (m, i) { return (i + 1) + '. ' + m; }).join('\n');
    } else {
      t += '\n\nMy first three moves:\n' + r.moves.map(function (m, i) { return (i + 1) + '. ' + m; }).join('\n');
    }
    return t;
  }

  // =====================================================================
  // EVENTS
  // =====================================================================
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    if (act === 'begin') go(firstOpen());
    else if (act === 'restart') { state = { step: 0, answers: {}, override: null, copied: '', research: freshResearch() }; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (act === 'go') go(+el.getAttribute('data-step'));
    else if (act === 'back') go(state.step - 1);
    else if (act === 'next') { if (!el.disabled) go(state.step === 9 ? 10 : state.step + 1); }
    else if (act === 'pick') {
      var key = STEPS[state.step - 1].key;
      state.answers[key] = id; state.override = null;
      render(id === 'other' ? 'other-input' : { sel: '[data-id="' + id + '"]' });
    }
    else if (act === 'comp') { state.research.comp = id; render({ sel: '[data-id="' + id + '"]' }); }
    else if (act === 'signal') { state.research.signals[id] = !state.research.signals[id]; render({ sel: '[data-id="' + id + '"]' }); }
    else if (act === 'alt') { var k = el.getAttribute('data-key'); state.override = k === topFormat(state.answers) ? null : k; state.copied = ''; render('r-title'); window.scrollTo({ top: 0, behavior: 'smooth' }); live.textContent = 'Showing a backup idea.'; }
    else if (act === 'top') { state.override = null; state.copied = ''; render('r-title'); }
    else if (act === 'copy') {
      copyText(summaryText()).then(function () {
        state.copied = 'yes'; var l = el.querySelector('.lbl'); if (l) l.textContent = 'Copied'; live.textContent = 'Copied to your clipboard.';
      }, function () { live.textContent = 'Copy did not work in this browser.'; });
    }
  });

  // Typing never re-renders, so the cursor stays put.
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'other-input') {
      state.answers.otherText = t.value; state.override = null;
      var next = document.getElementById('next-btn');
      if (next) next.disabled = !isAnswered(state.answers, 'expertise');
    } else if (t.hasAttribute('data-row')) {
      state.research.rows[+t.getAttribute('data-row')][t.getAttribute('data-field')] = t.value;
      updateSummary();
    } else if (t.id === 'gaps-input') {
      state.research.gaps = t.value;
    }
  });
  app.addEventListener('keydown', function (e) {
    if (e.target.id === 'other-input' && e.key === 'Enter' && isAnswered(state.answers, 'expertise')) { e.preventDefault(); go(state.step + 1); }
  });

  document.getElementById('year').textContent = new Date().getFullYear();
  render();
})();
</script>
</body>
</html>
