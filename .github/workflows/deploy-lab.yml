# Publishes lab/ to lab.emilydiazslp.com (Hostinger) on every push to main that changes it.
name: Deploy lab

on:
  push:
    branches: [main]
    paths: ["lab/**"]
  workflow_dispatch:

concurrency:
  group: deploy-lab
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload lab/ with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        # --delete removes pages that were deleted from lab/; .htaccess and
        # .well-known (used by Hostinger's SSL) are left alone on the server.
        run: |
          rsync -avz --delete \
            --exclude '.gitkeep' --exclude 'README.md' \
            --exclude '.htaccess' --exclude '.well-known/' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519" \
            lab/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"
