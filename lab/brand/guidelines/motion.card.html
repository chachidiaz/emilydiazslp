<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--cream-50);font-family:var(--font-sans)}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500);margin-top:8px}.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-500)}.b{display:inline-flex;align-items:center;justify-content:center;padding:14px 30px;border-radius:999px;font-weight:700;font-size:15px;background:var(--plum-700);color:var(--cream-50);transition:all 200ms cubic-bezier(.22,.61,.36,1)}.b:hover{background:var(--plum-900)}</style></head><body>
<div class="row" style="align-items:center"><span class="b">rest</span><span class="b" style="background:var(--plum-900)">hover — darken</span><span class="b" style="background:var(--plum-900);transform:scale(.97)">press — 0.97 scale</span></div>
<div class="mono" style="margin-top:12px">--dur-base 200ms · --ease-standard cubic-bezier(.22,.61,.36,1)</div>
</body></html>
