<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--cream-50);font-family:var(--font-sans)}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500);margin-top:8px}.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-500)}</style></head><body><div class="row">
<div style="flex:1;min-width:110px"><div style="height:74px;border-radius:12px;background:#4E7A5E;box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:8px;color:var(--white);font-size:11px;font-weight:600">#4E7A5E</div><div class="lbl">Success</div><div class="mono">--status-success</div></div><div style="flex:1;min-width:110px"><div style="height:74px;border-radius:12px;background:#B4762F;box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:8px;color:var(--white);font-size:11px;font-weight:600">#B4762F</div><div class="lbl">Warning</div><div class="mono">--status-warning</div></div><div style="flex:1;min-width:110px"><div style="height:74px;border-radius:12px;background:#A33B4B;box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:8px;color:var(--white);font-size:11px;font-weight:600">#A33B4B</div><div class="lbl">Error</div><div class="mono">--status-error</div></div><div style="flex:1;min-width:110px"><div style="height:74px;border-radius:12px;background:#C45B8F;box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:8px;color:var(--white);font-size:11px;font-weight:600">#C45B8F</div><div class="lbl">Info</div><div class="mono">--status-info</div></div>
</div></body></html>
